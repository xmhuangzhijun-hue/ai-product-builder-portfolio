<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI Product Builder Portfolio</title>
  <desc id="desc">Five connected product practices: IAA Business OS, Qinghe Agent, Organic Console, Xiaomo Control Plane and Agent Shared Memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08131f"/>
      <stop offset="1" stop-color="#102a38"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e3c3"/>
      <stop offset="1" stop-color="#70a5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="1025" cy="30" r="270" fill="#1e6d78" opacity=".18"/>
  <circle cx="120" cy="650" r="300" fill="#394f91" opacity=".16"/>

  <text x="76" y="92" fill="#ecf8f6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="42" font-weight="700">AI Product Builder Portfolio</text>
  <text x="76" y="136" fill="#a9c7c8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21">从真实业务问题，到可运行、可验证的产品</text>
  <rect x="76" y="160" width="292" height="5" rx="2.5" fill="url(#accent)"/>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="76" y="210" width="324" height="132" rx="20" fill="#132f3a" stroke="#57e3c3" stroke-opacity=".65"/>
    <text x="104" y="254" fill="#57e3c3" font-size="16" font-weight="700">REAL BUSINESS</text>
    <text x="104" y="291" fill="#f3fbfa" font-size="26" font-weight="650">IAA 业务运营系统</text>
    <text x="104" y="321" fill="#a9c7c8" font-size="16">CRM · 数据看板 · 飞书工作流</text>

    <rect x="438" y="210" width="324" height="132" rx="20" fill="#132f3a" stroke="#70a5ff" stroke-opacity=".65"/>
    <text x="466" y="254" fill="#70a5ff" font-size="16" font-weight="700">PERSONAL AGENT</text>
    <text x="466" y="291" fill="#f3fbfa" font-size="26" font-weight="650">清禾 AI Agent</text>
    <text x="466" y="321" fill="#a9c7c8" font-size="16">长期记忆 · 工具调用 · 权限与回执</text>

    <rect x="800" y="210" width="324" height="132" rx="20" fill="#132f3a" stroke="#c59cff" stroke-opacity=".65"/>
    <text x="828" y="254" fill="#c59cff" font-size="16" font-weight="700">AGENT PRODUCT</text>
    <text x="828" y="291" fill="#f3fbfa" font-size="26" font-weight="650">Organic Console</text>
    <text x="828" y="321" fill="#a9c7c8" font-size="16">创建 · 知识 · 配置 · 发布</text>

    <rect x="257" y="386" width="324" height="132" rx="20" fill="#132f3a" stroke="#ffbc6e" stroke-opacity=".65"/>
    <text x="285" y="430" fill="#ffbc6e" font-size="16" font-weight="700">TRUSTED EXECUTION</text>
    <text x="285" y="467" fill="#f3fbfa" font-size="26" font-weight="650">小末控制台</text>
    <text x="285" y="497" fill="#a9c7c8" font-size="16">任务 · 批准 · 验证 · 回滚</text>

    <rect x="619" y="386" width="324" height="132" rx="20" fill="#132f3a" stroke="#65d895" stroke-opacity=".65"/>
    <text x="647" y="430" fill="#65d895" font-size="16" font-weight="700">CONTINUITY</text>
    <text x="647" y="467" fill="#f3fbfa" font-size="26" font-weight="650">Agent Shared Memory</text>
    <text x="647" y="497" fill="#a9c7c8" font-size="16">来源 · 状态 · 经验 · 行为验证</text>
  </g>

  <text x="76" y="584" fill="#86a9ac" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Business understanding × Product judgment × AI-assisted implementation × Real-world verification</text>
</svg>
